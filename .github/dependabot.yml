# Keeps dependencies and the SHA-pinned GitHub Actions up to date. PR titles follow
# Conventional Commits ("chore(deps): …"), so they pass the "pr / title" check and do not trigger a release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # The client generator needs the TypeScript JS API, which TypeScript 7 removed (see README).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

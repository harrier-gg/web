name: PR-Titel
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # Wir mergen per Squash: Der PR-Titel wird zur Commit-Nachricht auf main,
  # und release-please erzeugt daraus Version und Changelog. Deshalb muss er Conventional Commits folgen.
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
